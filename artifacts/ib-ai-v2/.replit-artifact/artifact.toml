kind = "web"
previewPath = "/"
title = "IB AI v2"
version = "1.0.0"
id = "artifacts/ib-ai-v2"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23765

[services.development]
run = "pnpm --filter @workspace/ib-ai-v2 run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ib-ai-v2", "run", "build" ]
publicDir = "artifacts/ib-ai-v2/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23765"
BASE_PATH = "/"
